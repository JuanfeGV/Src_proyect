{% extends "base.html" %}

{% block head_extra %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/admin.css') }}">
{% endblock %}

{% block contenido %}
{% set ep = request.endpoint or '' %}
<div class="row g-4">
  <aside class="col-lg-3">
    <nav class="list-group panel-lateral" aria-label="Menú del panel">
      <a class="list-group-item {{ 'active' if ep == 'admin.panel' }}" href="{{ url_for('admin.panel') }}">Resumen</a>
      <a class="list-group-item {{ 'active' if ep.startswith('admin.municipio') or ep.startswith('admin.indicador') }}"
         href="{{ url_for('admin.municipios_lista') }}">Municipios</a>
      <a class="list-group-item {{ 'active' if ep.startswith('admin.articulo') }}"
         href="{{ url_for('admin.articulos_lista') }}">Artículos</a>
      <a class="list-group-item {{ 'active' if ep.startswith('admin.guia') }}"
         href="{{ url_for('admin.guias_lista') }}">Guías de consumo</a>
      <a class="list-group-item {{ 'active' if ep.startswith('admin.arbol') or ep.startswith('admin.nodo') }}"
         href="{{ url_for('admin.arbol_lista') }}">Árbol del problema</a>
      <a class="list-group-item {{ 'active' if ep.startswith('admin.reportes') }}"
         href="{{ url_for('admin.reportes_lista') }}">Reportes ciudadanos</a>
      <a class="list-group-item {{ 'active' if ep.startswith('admin.correos') }}"
         href="{{ url_for('admin.correos_lista') }}">Bandeja de entrada</a>
    </nav>
  </aside>
  <section class="col-lg-9">
    {% block panel %}{% endblock %}
  </section>
</div>
{% endblock %}
